name: ClickUp → Dispatch sync

# Крутится на серверах GitHub (компьютер не нужен): тянет задачи из ClickUp,
# перезаписывает js/pending-inject.js и пушит — Cloudflare публикует сам.
# Раньше запускался раз в сутки, поэтому задачи, созданные днём, появлялись
# в приложении только на следующее утро. Теперь — каждые 15 минут; коммит
# делается только если список реально изменился, так что пустых деплоев нет.
# Вручную: Actions → этот workflow → Run workflow.

on:
  schedule:
    - cron: '*/15 * * * *'     # каждые 15 минут
  workflow_dispatch: {}

permissions:
  contents: write              # lets the built-in token commit & push

concurrency:
  group: clickup-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Fetch ClickUp tasks → js/pending-inject.js
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          CLICKUP_TEAM_ID: ${{ secrets.CLICKUP_TEAM_ID }}   # optional, defaults below
          SYNC_DAYS_AHEAD: '40'                              # how far ahead to pull (covers ~the next month)
        run: node scripts/clickup-sync.mjs

      - name: Commit & push if changed
        run: |
          git config user.name  "dispatch-bot"
          git config user.email "dispatch-bot@users.noreply.github.com"
          git add js/pending-inject.js index.html
          if git diff --cached --quiet; then
            echo "No changes — nothing to deploy."
          else
            git commit -m "ClickUp sync $(date -u +%Y-%m-%d)"
            git push
            echo "Pushed — GitHub Pages will redeploy."
          fi
